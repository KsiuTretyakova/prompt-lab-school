<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Інтерактивне заняття для школярів: що таке промпт, навіщо і як ним користуватися.">
<title>Промпт-лабораторія</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;500;600;700;800&family=Rubik:wght@500;600;700;800&display=swap">
<style>
/* Layout: sunny school-club look — chunky "sticker" slides with a yellow offset shadow,
   a squared-notebook workbook, chat bubbles for every prompt. One light theme by design. */
:root{
  --sun:#FDBB15; --sun-deep:#D99A00; --sun-soft:#FFF2C9; --sun-pale:#FFF9E6;
  --ink:#1C1A29; --ink-2:#55516A; --ink-3:#8A8698;
  --bg:#FFFDF6; --card:#FFFFFF; --line:#ECE5D0;
  --sky:#2459E0; --sky-soft:#E4ECFF;
  --mint:#0B7A4C; --mint-b:#19A56B; --mint-soft:#DDF5EA;
  --coral:#C4343A; --coral-b:#E5484D; --coral-soft:#FDE5E5;
  --grape:#6A47E0; --grape-soft:#EEE8FF;
  --amber-t:#7A5200;
  --grid:#DCE7F5; --margin:#F3A9A9;
  --f-display:'Rubik','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hand:'Caveat','Segoe Print','Comic Sans MS',cursive;
  --r:18px; --r-lg:28px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);margin:0}
a{color:var(--sky);text-underline-offset:3px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
mark{background:none;color:inherit;position:relative;z-index:0;white-space:nowrap}
mark::before{content:"";position:absolute;left:-.08em;right:-.08em;bottom:.06em;height:.42em;background:var(--sun);border-radius:6px;z-index:-1;transform:rotate(-1deg)}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.center{text-align:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 22px;border-radius:999px;border:2px solid var(--ink);background:var(--sun);color:var(--ink);font:600 15px/1.1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.blue{background:var(--sky);color:#fff;border-color:var(--ink)}
.btn.small{min-height:38px;padding:7px 16px;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.btn.big{min-height:54px;padding:12px 28px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--ink)}

/* header */
.app{min-height:100%;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(16px,calc((100% - 1160px)/2));background:rgba(255,253,246,.94);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font:700 18px/1 var(--f-display)}
.mark-ic{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;background:var(--sun);border:2px solid var(--ink);flex:none}
.mark-ic svg{width:24px;height:24px}
.mark-ic path{fill:var(--card);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.mark-ic circle{fill:var(--ink)}
.school{display:inline-flex;align-items:center;gap:8px;font:600 14px/1.2 var(--f-display);color:var(--ink-2)}
.school img{height:30px;width:auto;display:block}
.tnav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tnav a{padding:8px 14px;border-radius:999px;color:var(--ink);text-decoration:none;font:600 14px/1 var(--f-display)}
.tnav a:hover{background:var(--sun-soft)}
.tnav a.on{background:var(--ink);color:var(--card)}
.starpill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--sun-soft);border:1.5px solid var(--sun);font:700 14px/1 var(--f-display);font-variant-numeric:tabular-nums}
.star{width:20px;height:20px;display:block}
.star path{fill:var(--sun);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:28px 48px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px max(16px,calc((100% - 1160px)/2));border-top:1.5px solid var(--line);font-size:14px;color:var(--ink-3)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));visibility:hidden;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--ink);color:var(--card);font:600 15px/1.2 var(--f-display);box-shadow:0 10px 30px rgba(28,26,41,.25);transition:transform .35s cubic-bezier(.2,.9,.3,1.3),visibility .35s;z-index:50;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast .star{width:22px;height:22px}

/* home */
.page{display:flex;flex-direction:column;gap:22px}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:36px;align-items:center;padding:12px 0 8px}
.hero-l{display:flex;flex-direction:column;gap:18px;min-width:0}
.grade{align-self:flex-start;padding:6px 14px;border-radius:999px;background:var(--grape-soft);color:var(--grape);font:700 14px/1 var(--f-display);letter-spacing:.04em}
.hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:800;letter-spacing:-.01em}
.lead{font-size:19px;color:var(--ink-2);max-width:56ch}
.cta{margin-top:6px}
.hero-r{position:relative;min-width:0;background:var(--sun-pale);border:2px solid var(--ink);border-radius:var(--r-lg);padding:22px;box-shadow:8px 8px 0 var(--sun)}
.hero-r .chat{gap:10px}
.hero-r .bubble{font-size:15px}
.hero-r .hand{position:absolute;right:18px;bottom:-34px;transform:rotate(-3deg)}
.sec-t{font-size:clamp(24px,3vw,32px);font-weight:700;margin-top:26px}
.learn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.lc{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px}
.lc-n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);font:700 16px/1 var(--f-display)}
.lc h3{font-size:19px}
.lc p{color:var(--ink-2);font-size:15.5px}
.mats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mat{display:flex;flex-direction:column;gap:8px;padding:20px;border-radius:var(--r);background:var(--card);border:2px solid var(--ink);color:var(--ink);text-decoration:none;transition:transform .15s ease, box-shadow .15s ease}
.mat:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--sun)}
.mat h3{font-size:22px}
.mat p{color:var(--ink-2);flex:1}
.go{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--sky)}
.go::after{content:" →"}
.progress{display:flex;gap:12px;align-items:center;padding:16px 18px;border-radius:var(--r);background:var(--sun-soft);margin-top:6px}
.progress .star{width:30px;height:30px;flex:none}

/* deck */
.page.wide{gap:12px}
.deck{display:flex;flex-direction:column;gap:16px}
.deck:fullscreen{background:var(--bg);padding:24px max(24px,calc((100% - 1300px)/2));overflow:auto}
.slide{position:relative;aspect-ratio:16/9;width:100%;background:var(--card);border:2px solid var(--ink);border-radius:var(--r-lg);box-shadow:8px 8px 0 var(--sun);padding:clamp(18px,3.2vw,40px) clamp(18px,3.6vw,48px) 54px;display:flex;flex-direction:column;gap:14px;min-width:0}
.s-kick{display:flex;justify-content:space-between;align-items:center;gap:12px;font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-2)}
.s-kick>span:first-child{padding:6px 12px;border-radius:999px;background:var(--sun-soft)}
.s-kick .school img{height:26px}
.slide h2{font-size:clamp(24px,3.3vw,40px);font-weight:800}
.s-body{display:flex;flex-direction:column;gap:14px;min-width:0}
.s-content{display:flex;flex-direction:column;gap:12px;font-size:clamp(16px,1.55vw,19px);min-width:0}
.s-content ul.big li,.s-content ol.rules li{margin:6px 0}
.sfoot{position:absolute;left:clamp(18px,3.6vw,48px);right:clamp(18px,3.6vw,48px);bottom:16px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hand{font:600 clamp(22px,2.2vw,28px)/1.15 var(--f-hand);color:var(--sky);display:flex;align-items:center;gap:8px;transform:rotate(-1.2deg);margin-top:auto;padding-top:4px}
.hand svg{width:40px;height:24px;flex:none}
.hand path{fill:none;stroke:var(--sky);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.s-title{background:var(--sun);justify-content:center;gap:20px;overflow:hidden;box-shadow:8px 8px 0 var(--ink)}
.st-top{position:absolute;top:24px;left:clamp(18px,3.6vw,48px);right:clamp(18px,3.6vw,48px);display:flex;justify-content:space-between;align-items:center}
.s-title .mark-ic{background:var(--card);width:46px;height:46px}
.s-title h1{font-size:clamp(38px,7vw,88px);font-weight:800;letter-spacing:-.02em;max-width:12ch;position:relative;z-index:1}
.s-title mark::before{background:var(--card)}
.s-sub{font-size:clamp(17px,2vw,24px);max-width:34ch;position:relative;z-index:1;font-weight:600}
.tchips{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.tchips span{padding:7px 14px;border-radius:999px;background:var(--card);border:2px solid var(--ink);font:600 14px/1 var(--f-display)}
.deco{position:absolute;right:clamp(14px,4vw,60px);top:18%;display:flex;flex-direction:column;gap:14px;align-items:flex-end}
.deco span{padding:12px 18px;border-radius:20px 20px 4px 20px;background:var(--card);border:2px solid var(--ink);font:700 clamp(14px,1.6vw,20px)/1 var(--f-display);box-shadow:4px 4px 0 var(--ink)}
.deco .d1{transform:rotate(4deg)}
.deco .d2{transform:rotate(-3deg);margin-right:40px}
.deco .d3{transform:rotate(2deg);background:var(--ink);color:var(--sun)}
.navbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.navbar .mid{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;min-width:0}
.sdots{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.sdots a{width:12px;height:12px;border-radius:50%;background:var(--line);border:1.5px solid var(--ink-3)}
.sdots a.seen{background:var(--sun-soft);border-color:var(--sun-deep)}
.sdots a.cur{background:var(--sun);border-color:var(--ink);transform:scale(1.25)}
.hint{font-size:14px;color:var(--ink-2)}

/* slide content blocks */
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cards4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:18px}
.card p{font-size:15.5px;color:var(--ink-2)}
.cards4 .card{background:var(--sun-pale);border-color:var(--sun)}
.card.good{background:var(--mint-soft);border-color:#9ED9BE}
.card.bad{background:var(--coral-soft);border-color:#F2B1B3}
.card ul{display:flex;flex-direction:column;gap:4px;font-size:16px}
.def{font-size:clamp(17px,1.7vw,21px);padding:12px 16px;border-left:5px solid var(--sun);background:var(--sun-pale);border-radius:0 12px 12px 0}
.analogy{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 16px;align-items:start;padding:14px 16px;border:1.5px dashed var(--ink-3);border-radius:var(--r)}
.analogy .tag{font:700 13px/1 var(--f-display);text-transform:uppercase;letter-spacing:.07em;padding:7px 10px;border-radius:8px;background:var(--grape-soft);color:var(--grape)}
.analogy>.ws{display:grid;margin:0}
.analogy .ws>div{font-size:16px}
.analogy>p{grid-column:1/-1;font-size:15.5px;color:var(--ink-2)}
.pr{background:var(--sun-soft);border-radius:8px;padding:1px 7px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.try{font-size:15px;line-height:2.1;margin-top:8px}
.try>span:first-child{color:var(--ink-2);margin-right:4px}
.try a{display:inline-block;line-height:1.3;font-weight:700;padding:4px 12px;margin:0 6px 0 0;border-radius:999px;border:1.5px solid var(--sky);text-decoration:none}
.try a:hover{background:var(--sky-soft)}
.age{font-size:15px;padding:12px 16px;border-radius:var(--r);background:var(--sky-soft);border:1.5px solid #B9CBF7}
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.light{border-radius:var(--r);padding:16px;border:2px solid var(--ink);display:flex;flex-direction:column;gap:8px;min-width:0}
.light h3{font-size:18px;display:flex;align-items:center;gap:8px}
.light h3::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}
.light ul{font-size:15.5px;display:flex;flex-direction:column;gap:4px}
.light.g{background:var(--mint-soft)} .light.g h3::before{background:var(--mint-b)}
.light.y{background:var(--sun-pale)} .light.y h3::before{background:var(--sun)}
.light.r{background:var(--coral-soft)} .light.r h3::before{background:var(--coral-b)}
.rules{display:flex;flex-direction:column;gap:6px;font-size:clamp(16px,1.6vw,19px)}
.rules li::marker{font-weight:800;color:var(--sun-deep)}

/* bricks */
.bricks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.brick{border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;border:2px solid var(--ink);position:relative;min-width:0}
.brick::before{content:"";position:absolute;top:-9px;left:16px;width:22px;height:9px;border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;background:inherit}
.brick::after{content:"";position:absolute;top:-9px;left:46px;width:22px;height:9px;border:2px solid var(--ink);border-bottom:0;border-radius:6px 6px 0 0;background:inherit}
.brick b{font:800 17px/1.1 var(--f-display)}
.brick span{font-size:14px;color:var(--ink-2)}
.brick q{font-size:15px;font-weight:700;quotes:"«" "»"}
.b-role{background:var(--grape-soft)} .b-task{background:var(--sun-soft)} .b-ctx{background:var(--sky-soft)} .b-fmt{background:var(--mint-soft)} .b-lim{background:var(--coral-soft)}

/* weak / strong */
.ws{display:grid;grid-template-columns:minmax(0,.6fr) minmax(0,1.4fr);gap:12px;margin-bottom:10px}
.ws>div{border-radius:14px;padding:14px 16px;font-size:16px;display:flex;flex-direction:column;gap:6px}
.ws .weak{background:var(--coral-soft);font-weight:700;font-size:20px}
.ws .strong{background:var(--mint-soft)}
.ws .lbl{font:700 12px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-width:0}
.bubble{max-width:92%;padding:10px 14px 11px;border-radius:18px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:3px}
.bubble .who{font:700 11px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.bubble.me{align-self:flex-end;background:var(--sun-soft);border-radius:18px 18px 4px 18px}
.bubble.ai{align-self:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px}
.bubble.ai.good{border-color:#9ED9BE;background:var(--mint-soft)}
.bubble.ai.hintb{border-color:#F2B1B3;background:var(--coral-soft)}
.bubble.wide{max-width:100%}
.bubble.fresh{animation:pop .3s ease both}
.typing{flex-direction:row;gap:5px;padding:14px 16px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* widgets */
.w{display:flex;flex-direction:column;gap:10px;min-width:0}
.w-intro{font-weight:700}
.q{font-weight:700;font-size:17px}
.qn{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--sun-soft);font:700 13px/1.4 var(--f-display);margin-right:4px;font-variant-numeric:tabular-nums}
.qbox{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1.5px dashed var(--line)}
.qbox:last-of-type{border-bottom:0}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 15.5px/1.35 var(--f-body);cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{display:inline-grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--sun-soft);font:700 12px/1 var(--f-display)}
.opt .k.box{border-radius:6px;background:var(--card);border:2px solid var(--ink-3)}
.opt.sel{border-color:var(--sky);background:var(--sky-soft)}
.opt.sel .k.box{background:var(--sky);border-color:var(--sky)}
.opt.is-ok{border-color:var(--mint-b);background:var(--mint-soft)}
.opt.is-bad{border-color:var(--coral-b);background:var(--coral-soft)}
.opt.is-ok .k.box{background:var(--mint-b);border-color:var(--mint-b)}
.opt.is-bad .k.box{background:var(--coral-b);border-color:var(--coral-b)}
.opt.is-missed{border-style:dashed;border-color:var(--mint-b)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{font-size:15.5px;border-radius:14px}
.fb:empty{display:none}
.fb.ok,.fb.bad,.fb.info{padding:12px 14px}
.fb.ok{background:var(--mint-soft);border:1.5px solid #9ED9BE}
.fb.bad{background:var(--coral-soft);border:1.5px solid #F2B1B3}
.fb.info{background:var(--sky-soft);border:1.5px solid #B9CBF7}
.fb ol,.fb ul{margin-top:6px}
.score{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px;border-radius:var(--r);background:var(--sun-soft);border:2px solid var(--ink)}
.score .big{font:800 30px/1 var(--f-display)}
.cls{display:flex;flex-direction:column;gap:10px}
.cls-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--card);border:1.5px solid var(--line)}
.cls-row.ok{border-color:#9ED9BE;background:#F4FBF7}
.cls-row.bad{border-color:#F2B1B3;background:#FFF7F7}
.cls-text{font-size:15.5px;min-width:0}
.cls-field{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.cls-ex{grid-column:1/-1;font-size:14.5px;color:var(--ink-2)}
.pill{padding:7px 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 13.5px/1.1 var(--f-display);cursor:pointer}
.pill:hover:not(:disabled){border-color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--ink)}

  card.appendChild(h('div', {class:'sfoot'}, h('span', null, L.title), h('span', null, i + ' / ' + total)));
  return card;
}
function fillDeck(wrap, i){
  var total = L.slides.length;
  S.slide = i; save();
  wrap.innerHTML = '';
  wrap.appendChild(buildSlide(i));
  var prev = i > 1 ? h('a', {class:'btn ghost', href:'#/s/' + (i - 1), 'aria-label':'Попередній слайд'}, '← Назад') : h('a', {class:'btn ghost', href:'#/'}, 'На головну');
  var next = i < total ? h('a', {class:'btn', href:'#/s/' + (i + 1), 'aria-label':'Наступний слайд'}, 'Далі →') : h('a', {class:'btn', href:'#/book'}, 'До зошита');
  var dots = h('div', {class:'sdots'});
  L.slides.forEach(function(_, k){ dots.appendChild(h('a', {href:'#/s/' + (k + 1), class: k + 1 === i ? 'cur' : (k + 1 < i ? 'seen' : ''), 'aria-label':'Слайд ' + (k + 1), 'aria-current': k + 1 === i ? 'step' : null})); });
  var mid = h('div', {class:'mid'}, dots);
  if (document.fullscreenEnabled) mid.appendChild(btn(document.fullscreenElement ? 'Вийти з повного екрана' : 'На весь екран', 'ghost small', function(){ try { if (document.fullscreenElement) document.exitFullscreen(); else wrap.requestFullscreen().catch(function(){}); } catch(e) {} }));
  wrap.appendChild(h('div', {class:'navbar'}, prev, mid, next));
}
function showSlides(i){
  i = Math.min(Math.max(1, i || 1), L.slides.length);
  var st = h('div', {class:'page wide'});
  var wrap = h('div', {class:'deck'});
  fillDeck(wrap, i);
  st.appendChild(wrap);
  st.appendChild(h('p', {class:'hint center'}, 'Гортати можна стрілками ← → на клавіатурі.'));
  return st;
}
function studentFields(list){
  var who = h('div', {class:'who'});
  list.forEach(function(f){
    var inp = h('input', {type:'text', id:'st-' + f[0], autocomplete:'off'});
    inp.value = S.student[f[0]] || '';
    inp.addEventListener('input', function(){ S.student[f[0]] = inp.value; save(); });
    who.appendChild(h('label', null, h('span', null, f[1]), inp));
  });
  return who;
}
function showBook(){
  var st = h('div', {class:'page'});
  var page = h('article', {class:'book'});
  page.appendChild(h('header', {class:'bhead'}, h('div', null, h('p', {class:'btitle'}, 'Робочий зошит'), h('h1', {id:'slide-title'}, L.title)), school('in-book')));
  page.appendChild(studentFields([['name', 'Ім’я'], ['class', 'Клас'], ['date', 'Дата']]));
  page.appendChild(h('section', {class:'notes'}, h('h2', null, 'Коротко про головне'), h('div', {html:L.notes})));

    var sec = h('section', {class:'task' + (t.hw ? ' hw' : '')});

  return st;
}
function certificate(right, n){
  var name = (S.student.name || '').trim();
  return h('div', {class:'cert', role:'region', 'aria-label':'Сертифікат'},
    h('div', {class:'cert-badge', html:STAR}),
    h('p', {class:'cert-k'}, 'Сертифікат'),
    h('h2', null, 'Майстер промптів'),
    h('p', {class:'cert-name'}, name || 'Впиши своє ім’я вгорі сторінки'),
    h('p', null, 'пройшов(-ла) заняття «' + L.title + '»'),
    h('div', {class:'cert-row'}, h('span', null, 'Тест: ', h('b', null, right + ' з ' + n)), h('span', null, 'Зірки: ', h('b', null, stars() + ' з ' + ALL.length)), S.student.date ? h('span', null, 'Дата: ', h('b', null, S.student.date)) : null));
}
function showTest(){
  var st = h('div', {class:'page'});
  var page = h('article', {class:'book'});
  page.appendChild(h('header', {class:'bhead'}, h('div', null, h('p', {class:'btitle'}, 'Фінальний тест'), h('h1', {id:'slide-title'}, L.title)), school('in-book')));
  page.appendChild(studentFields([['name', 'Ім’я'], ['class', 'Клас'], ['date', 'Дата']]));
  page.appendChild(h('p', null, L.test.length + ' запитань. Після кожної відповіді з’являється пояснення, а наприкінці — сертифікат.'));
  var certBox = h('div');
  if (S.act.test) certBox.appendChild(certificate(S.act.test.s, S.act.test.m));
  page.appendChild(mount({type:'quiz', id:'test', questions:L.test, onDone:function(r, n){ certBox.innerHTML = ''; certBox.appendChild(certificate(S.act.test.s, n)); setTimeout(function(){ try { certBox.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block:'center'}); } catch(e) {} }, 50); }}));
  page.appendChild(certBox);
  st.appendChild(page);
  st.appendChild(h('div', {class:'navbar'}, h('a', {class:'btn ghost', href:'#/book'}, '← До зошита'), h('span'), h('a', {class:'btn', href:'#/'}, 'На головну')));
  return st;
}
function route(){
  var r = curRoute();
  if (r[0] === 's') {
    var wrap = mainEl.querySelector('.deck');
    var i = Math.min(Math.max(1, +r[1] || 1), L.slides.length);
    if (wrap) { fillDeck(wrap, i); refreshHeader(); if (!document.fullscreenElement) window.scrollTo(0, 0); else wrap.scrollTop = 0; focusTitle(); return; }
  }
  var view;
  if (r[0] === 's') view = showSlides(+r[1]);
  else if (r[0] === 'book') view = showBook();
  else if (r[0] === 'test') view = showTest();
  else view = showHome();
  mainEl.innerHTML = ''; mainEl.appendChild(view);
  refreshHeader();
  window.scrollTo(0, 0);
  focusTitle();
}
function focusTitle(){ var t = mainEl.querySelector('#slide-title, h1'); if (t) { t.setAttribute('tabindex', '-1'); try { t.focus({preventScroll:true}); } catch(e) {} } }
function refreshHeader(){ var old = app.querySelector('header.top'); var nw = header(); if (old) old.replaceWith(nw); else app.insertBefore(nw, app.firstChild); }
function init(){
  app = h('div', {class:'app'});
  mainEl = h('main', {id:'main'});
  toastEl = h('div', {class:'toast', role:'status', 'aria-live':'polite'});
  app.appendChild(mainEl);
  app.appendChild(h('footer', {class:'foot'}, h('span', null, L.title + ' · заняття з промпт-інженерії для школярів'), school('in-foot')));
  document.body.appendChild(app);
  document.body.appendChild(toastEl);
  refreshHeader();
  window.addEventListener('hashchange', route);
  document.addEventListener('fullscreenchange', function(){ var r = curRoute(); var wrap = mainEl.querySelector('.deck'); if (wrap && r[0] === 's') fillDeck(wrap, +r[1] || 1); });
  document.addEventListener('keydown', function(e){
    if (e.target && /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
    var r = curRoute(); if (r[0] !== 's') return;
    var i = +r[1] || 1;
    if ((e.key === 'ArrowRight' || e.key === 'PageDown') && i < L.slides.length) { e.preventDefault(); location.hash = '#/s/' + (i + 1); }
    if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && i > 1) { e.preventDefault(); location.hash = '#/s/' + (i - 1); }
  });
  route();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
window.__lesson = {S:S, ALL:ALL, route:route};
})();
